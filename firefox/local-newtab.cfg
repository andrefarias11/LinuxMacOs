// Local homepage for new tabs only.
try {
 Services.obs.addObserver(function onWindowReady() {
  try {
   const {AboutNewTab} = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
   AboutNewTab.newTabURL = "file://@@HOME@@/.local/share/macos-desktop/Inicio-Firefox.html";
   Services.prefs.setStringPref("local.customNewTab.appliedURL", AboutNewTab.newTabURL);
   Services.console.logStringMessage("Local new-tab page configured: " + AboutNewTab.newTabURL);
   dump("LOCAL_NEWTAB_OK: " + AboutNewTab.newTabURL + "\n");
  } catch (error) { dump("LOCAL_NEWTAB_ERROR: " + error + "\n"); }
 }, "browser-delayed-startup-finished");
} catch (error) { dump("LOCAL_NEWTAB_ERROR: " + error + "\n"); }
